model:
  state_dim: 5
  action_dim: 5
  cameras: [front]
  image_hw: [240, 320]
  chunk_size: 32
  hidden_dim: 512
  nheads: 8
  encoder_layers: 4
  decoder_layers: 7
  dim_feedforward: 2048
  dropout: 0.1
  pretrained_backbone: true
