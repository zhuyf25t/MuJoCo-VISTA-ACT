  batch_size: 8
  learning_rate: 0.0001
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  grad_clip: 1.0
  seed: 42
  num_workers: 8
  amp: false
  patience: 0
  min_delta: 0.0
