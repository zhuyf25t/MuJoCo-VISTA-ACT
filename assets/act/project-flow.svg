<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120">
<rect width="1680" height="1120" fill="#f8fafc"/>
<text x="48" y="35" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" fill="#14283f">从 VISTA 示范到 ACT 部署</text>
<text x="48" y="92" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#526579">绿色：已有基础  ·  蓝色：待实现的数据与训练模块  ·  紫色：学习模型  ·  箭头表示数据或指令流</text>
<text x="48" y="148" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">01  采集一集完整任务</text>
<rect x="48" y="200" width="320" height="160" rx="16" fill="#e8f6f2" stroke="#c7d4e2" stroke-width="2"/>
<text x="68" y="215" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#14283f">VISTA + 图像 / 本体状态</text>
<text x="68" y="256" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">你负责接入 o_t</text>
