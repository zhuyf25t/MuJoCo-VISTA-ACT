<text x="463" y="256" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">预设姿态、移动、开闭爪</text>
<text x="463" y="290" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">展开为每个控制拍的目标</text>
