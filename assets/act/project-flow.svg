<text x="493" y="514" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#14283f">完整性 / 时间对齐 / 示范质量</text>
<text x="493" y="548" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#14283f">成功、有效、训练入选分别记录</text>
