<text x="858" y="290" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">控制 10 Hz / 物理 500 Hz</text>
