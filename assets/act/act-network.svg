<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1450" viewBox="0 0 1760 1450">
<rect width="1760" height="1450" fill="#f8fafc"/>
<text x="48" y="35" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" fill="#14283f">ACT：训练支线与部署主线</text>
<text x="48" y="92" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#526579">本文示例：B 批量，C=1，H×W=240×320，Ds=Da=5，K=20，d=512，z_dim=32</text>
<text x="48" y="150" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#6652a8">A  只在训练时使用：CVAE 后验编码器 qφ(z | s_t, A_t)</text>
<rect x="48" y="205" width="340" height="170" rx="16" fill="#f1edff" stroke="#c7d4e2" stroke-width="2"/>
<text x="68" y="220" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">当前状态 + 专家动作块</text>
<text x="68" y="261" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">s_t  [B, Ds]</text>
<text x="68" y="295" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">A_t  [B, K, Da]</text>
<text x="68" y="329" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">is_pad=True 表示补齐</text>
<rect x="453" y="205" width="420" height="170" rx="16" fill="#f1edff" stroke="#c7d4e2" stroke-width="2"/>
<text x="473" y="220" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">[CLS] + 状态 token + K 动作</text>
<text x="473" y="261" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">各自线性投影 + 序列位置编码</text>
<text x="473" y="295" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">Transformer Encoder（独立参数）</text>
<text x="473" y="329" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">补齐动作不参与注意力的 K/V</text>
<rect x="938" y="205" width="330" height="170" rx="16" fill="#f1edff" stroke="#c7d4e2" stroke-width="2"/>
<text x="958" y="220" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">只取 CLS 的输出</text>
<text x="958" y="261" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">线性映射到 2 × z_dim</text>
<text x="958" y="295" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">分成 μ 与 log σ²</text>
<text x="958" y="329" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">二者均为 [B, 32]</text>
<rect x="1333" y="205" width="375" height="170" rx="16" fill="#f1edff" stroke="#c7d4e2" stroke-width="2"/>
<text x="1353" y="220" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">重参数化得到 z</text>
<text x="1353" y="261" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">σ = exp(0.5 × log σ²)</text>
<text x="1353" y="295" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">z = μ + σ × ε</text>
<text x="1353" y="329" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">ε ~ N(0, I)</text>
<polyline points="388,290 453,290" fill="none" stroke="#8270ba" stroke-width="3" stroke-linejoin="round"/>
<polygon points="453.0,290.0 441.3,295.7 441.3,284.3" fill="#8270ba"/>
<polyline points="873,290 938,290" fill="none" stroke="#8270ba" stroke-width="3" stroke-linejoin="round"/>
