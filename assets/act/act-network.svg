<polyline points="1268,290 1333,290" fill="none" stroke="#8270ba" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1333.0,290.0 1321.3,295.7 1321.3,284.3" fill="#8270ba"/>
<text x="48" y="425" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#245a9c">B  训练和部署共用：策略网络 πθ(A_t | o_t, z)</text>
<rect x="48" y="485" width="310" height="175" rx="16" fill="#e8f6f2" stroke="#c7d4e2" stroke-width="2"/>
<text x="68" y="500" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">车头图像</text>
<text x="68" y="541" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">[B, C, 3, H, W]</text>
<text x="68" y="575" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">像素 / 255</text>
<text x="68" y="609" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">ImageNet 通道标准化</text>
<rect x="423" y="485" width="395" height="175" rx="16" fill="#eaf2ff" stroke="#c7d4e2" stroke-width="2"/>
<text x="443" y="500" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">ResNet-18 + 1×1 Conv</text>
<text x="443" y="541" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">移除分类头；投影到 d 通道</text>
<text x="443" y="575" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">[B×C, d, 8, 10]</text>
<text x="443" y="609" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">展平：80 个视觉 token / 相机</text>
<rect x="883" y="485" width="370" height="175" rx="16" fill="#eaf2ff" stroke="#c7d4e2" stroke-width="2"/>
<text x="903" y="500" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">视觉位置与来源</text>
<text x="903" y="541" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">二维正弦位置编码</text>
<text x="903" y="575" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">本设计显式加入相机编号</text>
<text x="903" y="609" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">加上视觉类型嵌入</text>
<polyline points="358,570 423,570" fill="none" stroke="#718398" stroke-width="3" stroke-linejoin="round"/>
<polygon points="423.0,570.0 411.3,575.7 411.3,564.3" fill="#718398"/>
<polyline points="818,570 883,570" fill="none" stroke="#718398" stroke-width="3" stroke-linejoin="round"/>
<polygon points="883.0,570.0 871.3,575.7 871.3,564.3" fill="#718398"/>
<rect x="48" y="710" width="310" height="145" rx="16" fill="#e8f6f2" stroke="#c7d4e2" stroke-width="2"/>
<text x="68" y="725" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">当前实测状态 s_t</text>
<text x="68" y="766" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#14283f">按训练集统计归一化</text>
<text x="68" y="800" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#14283f">Linear(Ds → d)：1 个 token</text>
<rect x="423" y="710" width="395" height="145" rx="16" fill="#f1edff" stroke="#c7d4e2" stroke-width="2"/>
<text x="443" y="725" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">潜变量 z</text>
<text x="443" y="766" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">训练：来自上方后验分支</text>
<text x="443" y="800" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">部署：固定 z=0；Linear → d</text>
<polyline points="1520,375 1520,407 848,407 848,687 620,687 620,710" fill="none" stroke="#8270ba" stroke-width="3" stroke-linejoin="round"/>
<polygon points="620.0,710.0 614.3,698.3 625.7,698.3" fill="#8270ba"/>
<rect x="883" y="710" width="370" height="145" rx="16" fill="#eaf2ff" stroke="#c7d4e2" stroke-width="2"/>
<text x="903" y="725" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">拼接多模态 token</text>
<text x="903" y="766" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">状态 1 + 潜变量 1 + 图像 80</text>
<text x="903" y="800" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">N = C×h×w + 2 = 82</text>
<polyline points="1068,660 1068,710" fill="none" stroke="#718398" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1068.0,710.0 1062.3,698.3 1073.7,698.3" fill="#718398"/>
