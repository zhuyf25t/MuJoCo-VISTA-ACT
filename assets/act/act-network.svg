<polygon points="883.0,770.0 871.3,775.7 871.3,764.3" fill="#718398"/>
<rect x="1318" y="485" width="390" height="370" rx="16" fill="#eaf2ff" stroke="#c7d4e2" stroke-width="2"/>
<text x="1338" y="500" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">策略 Transformer Encoder</text>
<text x="1338" y="541" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">本设计 L_enc = 4 层</text>
<text x="1338" y="575" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">每层：</text>
<text x="1338" y="609" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">多头 Self-Attention</text>
<text x="1338" y="643" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">Residual + LayerNorm</text>
<text x="1338" y="677" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">FFN + Residual + LayerNorm</text>
<text x="1338" y="711" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">输出 memory [B, 82, 512]</text>
<polyline points="1253,782 1285,782 1285,740 1318,740" fill="none" stroke="#718398" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1318.0,740.0 1306.3,745.7 1306.3,734.3" fill="#718398"/>
<text x="48" y="930" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#245a9c">C  K 个动作槽并行解码；没有自回归循环，没有因果掩码</text>
<rect x="48" y="990" width="365" height="190" rx="16" fill="#eaf2ff" stroke="#c7d4e2" stroke-width="2"/>
<text x="68" y="1005" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">K 个可学习 Action Query</text>
<text x="68" y="1046" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">query_pos [K, d]</text>
<text x="68" y="1080" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">内容 tgt 初始化为 0</text>
<text x="68" y="1114" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">每个槽对应未来一个控制拍</text>
<rect x="478" y="990" width="610" height="235" rx="16" fill="#eaf2ff" stroke="#c7d4e2" stroke-width="2"/>
<text x="498" y="1005" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">策略 Transformer Decoder  × L_dec=7</text>
<text x="498" y="1046" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">1. Self-Attention：K 个动作槽彼此交流</text>
<text x="498" y="1080" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">2. Cross-Attention：Q 来自动作槽，K/V 来自 memory</text>
<text x="498" y="1114" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">3. FFN；各子层都有 Residual + LayerNorm</text>
<text x="498" y="1148" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">读取最后一层输出 [B, K, d]</text>
<rect x="1153" y="990" width="555" height="190" rx="16" fill="#e8f6f2" stroke="#c7d4e2" stroke-width="2"/>
<text x="1173" y="1005" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">共享线性动作头 Linear(d → Da)</text>
<text x="1173" y="1046" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">一次输出整块 Â_t：[B, 20, 5]</text>
<text x="1173" y="1080" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">五维：肩目标、肘目标、夹爪目标、v、ω</text>
<text x="1173" y="1114" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">各槽共享头参数；通过注意力相互关联</text>
