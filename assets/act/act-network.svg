<polygon points="800.0,990.0 794.3,978.3 805.7,978.3" fill="#718398"/>
<rect x="48" y="1270" width="1040" height="105" rx="16" fill="#fff1e2" stroke="#c7d4e2" stroke-width="2"/>
<text x="68" y="1285" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">训练：有效动作 L1 + β × KL(qφ || N(0,I))</text>
<text x="68" y="1326" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#14283f">专家 A_t 是监督标签，不会作为部署时的输入</text>
<rect x="1153" y="1235" width="555" height="140" rx="16" fill="#e8f6f2" stroke="#c7d4e2" stroke-width="2"/>
<text x="1173" y="1250" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#14283f">部署：取当前时刻的动作</text>
<text x="1173" y="1291" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">时间集成（可选）→ 反归一化 → 适配器</text>
<text x="1173" y="1325" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#14283f">施加一个控制拍，再观察</text>
